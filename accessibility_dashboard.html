<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Upload a PDF and review its accessibility audit report">
  <title>PDF Accessibility Audit</title>
  <style>
    :root {
      --navy: #102a43;
      --ink: #243b53;
      --muted: #526777;
      --line: #cfd9e3;
      --amber: #8a5700;
      --amber-bg: #fff6df;
      --focus: #1463ff;
      --blue: #145dbf;
      --green: #087443;
      --red: #b42318;
      --red-bg: #fff1f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: linear-gradient(145deg, #eaf3fb 0%, #f8fafc 48%, #fff3e8 100%);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.55;
    }

    .skip-link {
      position: absolute;
      top: 12px;
      left: -9999px;
      z-index: 2;
      padding: 10px 14px;
      color: var(--navy);
      background: #fff;
      border: 2px solid var(--focus);
    }

    .skip-link:focus {
      left: 12px;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 6vw, 72px);
    }

    .dashboard {
      width: min(920px, 100%);
      padding: clamp(26px, 5vw, 50px);
      background: #fff;
      border: 1px solid var(--line);
      border-top: 6px solid var(--blue);
      border-radius: 8px;
      box-shadow: 0 18px 50px rgb(16 42 67 / 12%);
    }

    .kicker {
      margin: 0 0 10px;
      color: var(--blue);
      font-family: "Trebuchet MS", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(1.8rem, 5vw, 3rem);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .intro {
      max-width: 680px;
      margin-top: 12px;
      color: var(--muted);
    }

    .audit-form,
    .report {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .file-picker {
      display: grid;
      gap: 8px;
      padding: 24px;
      background: #f6f9fc;
      border: 2px dashed #9db0c2;
      border-radius: 8px;
    }

    .file-picker:focus-within {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .file-picker label {
      color: var(--navy);
      font-family: "Trebuchet MS", sans-serif;
      font-weight: 700;
    }

    input[type="file"] {
      width: 100%;
      color: var(--muted);
      font: inherit;
    }

    input[type="file"]::file-selector-button,
    button {
      min-height: 44px;
      padding: 10px 16px;
      color: #fff;
      background: var(--blue);
      border: 2px solid transparent;
      border-radius: 6px;
      font-family: "Trebuchet MS", sans-serif;
      font-weight: 700;
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      margin-right: 12px;
    }

    button {
      margin-top: 16px;
    }

    button:hover:not(:disabled),
    input[type="file"]::file-selector-button:hover {
      background: #0e4d9f;
    }

    button:disabled {
      color: #4f5d68;
      background: #d7dee5;
      cursor: not-allowed;
    }

    button:focus-visible,
    input[type="file"]:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .message {
      margin-top: 16px;
      padding: 14px 16px;
      border-left: 5px solid var(--blue);
      background: #edf5ff;
    }

    .message.error {
      color: var(--red);
      background: var(--red-bg);
      border-color: var(--red);
      font-weight: 700;
    }

    .report-header {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 16px;
    }

    .report-file {
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .report-output {
      max-height: 70vh;
      margin: 16px 0 0;
      padding: 18px;
      overflow: auto;
      color: #172b4d;
      background: #f6f8fa;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: 0.9rem/1.6 "Courier New", monospace;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    [hidden] {
      display: none !important;
    }

    h2 {
      margin: 0 0 7px;
      color: var(--navy);
      font-family: "Trebuchet MS", sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0;
    }

    p {
      margin: 0;
    }

    @media print {
      body {
        min-height: 0;
        background: #fff;
      }

      main {
        min-height: 0;
        padding: 0;
      }

      .dashboard {
        border: 1px solid #777;
        box-shadow: none;
      }

      .skip-link,
      .audit-form,
      .print-button {
        display: none;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content">
    <article class="dashboard" aria-labelledby="page-title">
      <p class="kicker">PDF accessibility audit</p>
      <h1 id="page-title">Accessibility Checker</h1>
      <p class="intro">Upload the original PDF to inspect its accessibility structure and generate the evidence-based audit report.</p>

      <form class="audit-form" id="audit-form">
        <div class="file-picker">
          <label for="pdf-file">PDF document</label>
          <input id="pdf-file" name="file" type="file" accept="application/pdf,.pdf" required aria-describedby="file-help">
          <p id="file-help">Maximum file size: 25 MB.</p>
        </div>
        <button id="run-audit" type="submit" disabled>Run Accessibility Audit</button>
      </form>

      <p class="message" id="audit-status" role="status" aria-live="polite" hidden></p>
      <p class="message error" id="audit-error" role="alert" hidden></p>

      <section class="report" id="report" aria-labelledby="report-title" hidden>
        <div class="report-header">
          <div>
            <h2 id="report-title">Accessibility Audit Report</h2>
            <p class="report-file">File: <strong id="report-filename"></strong></p>
          </div>
          <button class="print-button" id="print-report" type="button">Print report</button>
        </div>
        <pre class="report-output" id="report-output" tabindex="0"></pre>
      </section>
    </article>
  </main>
  <script>
    (() => {
      const form = document.getElementById("audit-form");
      const fileInput = document.getElementById("pdf-file");
      const runButton = document.getElementById("run-audit");
      const status = document.getElementById("audit-status");
      const error = document.getElementById("audit-error");
      const report = document.getElementById("report");
      const reportFilename = document.getElementById("report-filename");
      const reportOutput = document.getElementById("report-output");
      const maxFileSize = 25 * 1024 * 1024;
      const apiUrl = window.location.protocol === "file:"
        ? "http://127.0.0.1:8000/api/audit"
        : "/api/audit";

      function showError(message) {
        error.textContent = message;
        error.hidden = false;
      }

      function resetMessages() {
        status.hidden = true;
        error.hidden = true;
        error.textContent = "";
      }

      fileInput.addEventListener("change", () => {
        resetMessages();
        const file = fileInput.files[0];
        const validPdf = file && (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf"));

        if (!file) {
          runButton.disabled = true;
          return;
        }
        if (!validPdf) {
          runButton.disabled = true;
          showError("Select a PDF file.");
          return;
        }
        if (file.size > maxFileSize) {
          runButton.disabled = true;
          showError("The selected PDF exceeds the 25 MB size limit.");
          return;
        }
        runButton.disabled = false;
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = fileInput.files[0];
        if (!file) return;

        resetMessages();
        report.hidden = true;
        status.textContent = "Auditing the PDF. This may take a moment.";
        status.hidden = false;
        runButton.disabled = true;
        runButton.textContent = "Running audit...";
        form.setAttribute("aria-busy", "true");

        const body = new FormData();
        body.append("file", file);

        try {
          const response = await fetch(apiUrl, { method: "POST", body });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.detail || `Audit request failed (${response.status}).`);
          }

          reportFilename.textContent = data.filename || file.name;
          reportOutput.textContent = data.report || "No audit report was returned.";
          report.hidden = false;
          status.hidden = true;
          report.scrollIntoView({ behavior: "smooth", block: "start" });
          reportOutput.focus();
        } catch (requestError) {
          status.hidden = true;
          showError(requestError.message || "The accessibility audit could not be completed.");
        } finally {
          form.removeAttribute("aria-busy");
          runButton.disabled = false;
          runButton.textContent = "Run Accessibility Audit";
        }
      });

      document.getElementById("print-report").addEventListener("click", () => window.print());
    })();
  </script>
</body>
</html>
